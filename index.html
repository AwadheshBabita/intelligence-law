<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Law | AI Legal Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070d1e;
            --chat-bg: #0b152d;
            --user-msg-bg: #1e293b;
            --ai-msg-bg: #0f1c3f;
            --accent: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 13, 30, 0.95);
        }

        .logo { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        .engine-badge { font-size: 0.75rem; background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 90%;
            padding: 16px;
            border-radius: 16px;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
            width: 100%;
        }

        .msg-sender { font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; color: var(--accent); }
        .section-tag { background: var(--accent-gold); color: #000; font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; display: inline-block; margin-bottom: 8px; width: fit-content; }
        .result-title { font-size: 1.1rem; color: #fff; margin-bottom: 10px; font-weight: 600; }
        .direct-answer { background: rgba(56, 189, 248, 0.1); border-left: 3px solid var(--accent); padding: 10px; border-radius: 4px; margin-bottom: 12px; font-size: 0.9rem; color: #e2e8f0; }
        .block-title { font-size: 0.9rem; color: var(--accent); margin: 12px 0 6px; font-weight: 600; }

        ul.legal-list { list-style: none; padding-left: 0; }
        ul.legal-list li { position: relative; padding-left: 18px; margin-bottom: 6px; color: #cbd5e1; font-size: 0.85rem; line-height: 1.5; }
        ul.legal-list li::before { content: "•"; position: absolute; left: 4px; color: var(--accent); font-weight: bold; }

        .disclaimer-text { margin-top: 12px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; }

        .input-wrapper { padding: 12px 16px; background: rgba(7, 13, 30, 0.95); border-top: 1px solid var(--border); }
        .input-box { max-width: 900px; margin: 0 auto; display: flex; align-items: center; background: var(--chat-bg); border: 1px solid var(--border); border-radius: 28px; padding: 6px 12px; gap: 8px; }
        .input-box:focus-within { border-color: var(--accent); }

        textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.95rem; resize: none; height: 24px; padding: 4px 8px; line-height: 24px; }
        .btn-icon { background: transparent; border: none; color: var(--text-muted); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
        .btn-mic.recording { color: var(--danger); }
        .btn-send { background: var(--accent); color: #070d1e; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚖️ Intelligence Law</div>
        <span class="engine-badge">BNS & BNSS v1.2</span>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            <div class="msg-sender">AI विधिक सहायक</div>
            <p style="font-size: 0.9rem; color: #cbd5e1;">
                नमस्ते! आप अपनी कानूनी समस्या नीचे लिखकर या <strong>माइक (🎙️) बटन</strong> दबाकर बोल सकते हैं।
            </p>
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <button id="micBtn" class="btn-icon btn-mic" onclick="toggleVoiceInput()" title="बोलकर लिखें">🎙️</button>
            <textarea id="userQuery" rows="1" placeholder="यहाँ सवाल लिखें या माइक दबाकर बोलें..."></textarea>
            <button class="btn-icon btn-send" onclick="handleSend()" title="भेजें">➔</button>
        </div>
    </div>

    <script>
        const legalDatabase = [
            {
                keywords: ["थाने बुलाया", "थाना बुलाया", "बुलाया गया", "पुलिस बुला रही", "police station", "calling to police station"],
                section: "BNSS धारा 35(3) (Notice of Appearance)",
                title: "थाने में उपस्थित होने का सम्मन/नोटिस",
                directAnswer: "हाँ, लेकिन केवल तब जब पुलिस द्वारा धारा 35(3) BNSS के तहत लिखित नोटिस जारी किया गया हो। केवल मौखिक फोन कॉल पर जाना कानूनन बाध्यकारी नहीं है।",
                ingredients: [
                    "पुलिस अधिकारी को जांच के सिलसिले में किसी व्यक्ति को बुलाने के लिए लिखित नोटिस जारी करना अनिवार्य है।",
                    "नोटिस में कारण और संबंधित शिकायत/मामले का उल्लेख होना आवश्यक है।"
                ],
                rights: [
                    "लिखित नोटिस मांगने का कानूनी अधिकार।",
                    "थाने जाते समय अपने साथ किसी मित्र, परिजन या अधिवक्ता को ले जाने का अधिकार।",
                    "थाने में अपनी उपस्थिति (GD Entry/पावती) दर्ज करवाने का अधिकार।"
                ],
                limits: [
                    "पुलिस बिना औपचारिक नोटिस या संज्ञेय अपराध के मनमाने ढंग से थाने में नहीं बैठा सकती।",
                    "धारा 35 BNSS: यदि आप जांच में सहयोग कर रहे हैं, तो सीधे गिरफ्तार नहीं किया जा सकता।"
                ],
                remedies: [
                    "1. जांच अधिकारी (IO) से कहें कि वे धारा 35(3) BNSS के तहत लिखित नोटिस या समय भेजें।",
                    "2. यदि लिखित नोटिस मिल चुका है, तो निर्धारित समय पर उपस्थित होकर सहयोग करें।",
                    "3. थाने में उपस्थिति का प्रमाण (लिखित पावती या डायरी नंबर) अवश्य लें।"
                ]
            },
            {
                keywords: ["चोरी", "बाइक", "सामान", "theft", "stolen", "mobile", "पर्स"],
                section: "BNS Section 303(2)",
                title: "चोरी (Theft) का मामला",
                directAnswer: "नजदीकी थाने में तुरंत धारा 173 BNSS के तहत निःशुल्क FIR दर्ज करवाएं।",
                ingredients: ["चल संपत्ति को बेईमानी से कब्जे से हटाना।"],
                rights: ["मुफ्त FIR और जांच स्थिति जानने का अधिकार।"],
                limits: ["संज्ञेय अपराध होने पर पुलिस बिना वारंट जांच कर सकती है।"],
                remedies: ["1. थाने में लिखित शिकायत दें। 2. मना करने पर SP को धारा 173(4) BNSS के तहत भेजें।"]
            },
            {
                keywords: ["धमकी", "जान से मारने", "गाली", "threat", "intimidation"],
                section: "BNS Section 351(2)",
                title: "आपराधिक धमकी (Criminal Intimidation)",
                directAnswer: "सभी डिजिटल साक्ष्य (कॉल रिकॉर्डिंग/चैट) सुरक्षित रखें और धारा 174 BNSS के तहत NCR दर्ज कराएं।",
                ingredients: ["शरीर, संपत्ति या प्रतिष्ठा को नुकसान पहुँचाने की धमकी।"],
                rights: ["NCR दर्ज कराने और मजिस्ट्रेट से जांच आदेश की मांग का अधिकार।"],
                limits: ["असंज्ञेय अपराध में पुलिस बिना मजिस्ट्रेट वारंट गिरफ्तारी नहीं कर सकती।"],
                remedies: ["1. साक्ष्य सुरक्षित करें। 2. NCR दर्ज कराएं।"]
            }
        ];

        // Voice Input
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('userQuery').placeholder = "सुन रहा हूँ... बोलिए...";
            };
            recognition.onresult = (e) => {
                document.getElementById('userQuery').value = e.results[0][0].transcript;
            };
            recognition.onend = () => stopRecording();
            recognition.onerror = () => stopRecording();
        }

        function toggleVoiceInput() {
            if (!recognition) { alert("ब्राउज़र में वॉइस टाइपिंग सपोर्ट नहीं है। कृपया लिखकर पूछें।"); return; }
            if (isRecording) recognition.stop();
            else recognition.start();
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('userQuery').placeholder = "यहाँ सवाल लिखें या माइक दबाकर बोलें...";
        }

        function handleSend() {
            const input = document.getElementById("userQuery");
            const query = input.value.trim();
            if (!query) return;

            appendUserMsg(query);
            input.value = "";

            setTimeout(() => {
                const match = legalDatabase.find(item => item.keywords.some(k => query.toLowerCase().includes(k.toLowerCase())));
                appendAIMsg(match || getDefaultMatch());
            }, 300);
        }

        function getDefaultMatch() {
            return {
                section: "संविधान एवं सामान्य विधिक सिद्धांत",
                title: "कानूनी विश्लेषण एवं मार्गदर्शन",
                directAnswer: "कानून सम्मत प्रक्रिया के तहत अपने अधिकारों और साक्ष्यों को स्पष्ट रखें।",
                ingredients: ["घटना के पूर्ण तथ्य और तिथि/समय स्पष्ट होना अनिवार्य है।"],
                rights: ["अनुच्छेद 21: जीवन, व्यक्तिगत स्वतंत्रता और निष्पक्ष सुनवाई का अधिकार।"],
                limits: ["प्रशासन कानून द्वारा स्थापित प्रक्रिया (Due Process) से बाहर कार्य नहीं कर सकता।"],
                remedies: ["1. घटना के सभी साक्ष्य सुरक्षित रखें।", "2. नजदीकी पुलिस स्टेशन या सक्षम प्राधिकारी के समक्ष लिखित आवेदन दें।"]
            };
        }

        function appendUserMsg(text) {
            const container = document.getElementById("chatContainer");
            const div = document.createElement("div");
            div.className = "message user-message";
            div.innerHTML = `<div class="msg-sender" style="color:#94a3b8;">आप</div><div>${text}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendAIMsg(data) {
            const container = document.getElementById("chatContainer");
            const div = document.createElement("div");
            div.className = "message ai-message";

            div.innerHTML = `
                <div class="msg-sender">AI विधिक सहायक</div>
                <span class="section-tag">${data.section}</span>
                <div class="result-title">${data.title}</div>
                <div class="direct-answer"><strong>💡 सीधा समाधान:</strong> ${data.directAnswer}</div>
                <div class="block-title">📋 कानूनी प्रावधान एवं आधार</div>
                <ul class="legal-list">${data.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                <div class="block-title">🛡️ आपके अधिकार (Citizen Rights)</div>
                <ul class="legal-list">${data.rights.map(i => `<li>${i}</li>`).join('')}</ul>
                <div class="block-title">👮 पुलिस की कानूनी सीमा (Authority Limits)</div>
                <ul class="legal-list">${data.limits.map(i => `<li>${i}</li>`).join('')}</ul>
                <div class="block-title">⚖️ कानूनी उपाय (Next Steps)</div>
                <ul class="legal-list">${data.remedies.map(i => `<li>${i}</li>`).join('')}</ul>
                <div class="disclaimer-text">⚠️ <em>यह विश्लेषण विधिक जागरूकता के लिए है, अधिवक्ता का विकल्प नहीं।</em></div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById("userQuery").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
    </script>
</body>
</html>
